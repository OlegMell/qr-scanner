@if (isScannerShown()) {
  <app-qr-scanner (scanPaused)="handleScanPaused($event)"/>
} @else {
  <div class="thumbnail">
    <h2 animate.enter="slide-in" animate.leave="slide-out">Scan QR & save for future</h2>
  </div>
}

<app-qr-history/>

<button class="qr-button" qrScanner (click)="toggleQrScanner()"></button>
