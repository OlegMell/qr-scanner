<div class="qr-history-header">
  <button class="qr-history-header-toggle" (click)="toggle()">
    Scan history <span [class]="`arrow-icon ${isExpanded() ? 'expanded' : ''}`"></span>
  </button>
  @if (qrCodes().length) {
    <button editListButton class="edit-button"></button>
  }
</div>
<ul class="qr-history-list">
  @for (qr of qrCodes(); track qr) {
    <li><a [href]="qr">{{ qr }}</a></li>
  } @empty {
    <p>no qr codes scanned yet...</p>
  }
</ul>
